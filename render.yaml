services:
  - type: web
    name: eatake
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: DATA_DIR
        value: /var/data
      - key: GEMINI_API_KEY
        sync: false
    disk:
      name: eatake-data
      mountPath: /var/data
      sizeGB: 1
